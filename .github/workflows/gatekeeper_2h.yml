name: Gatekeeper 2-Hourly Engine Health Audit

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  gatekeeper-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Verify Core UI & 6-Tab Lock
        run: python lock_check.py

      - name: Run Full 6-Tab & Gatekeeper Diagnostic Audit
        run: |
          python -c "
          import app
          c = app.app.test_client()
          for tab in ['daily_picks', 'btts_goals', 'bet_builder', 'correct_score', 'true_clv', 'tactical_health']:
              r = c.get(f'/?tab={tab}')
              assert r.status_code == 200, f'Tab {tab} failed with {r.status_code}'
          gk = c.get('/gatekeeper').get_json()
          print('GATEKEEPER AUDIT:', gk)
          if gk['gatekeeper_status'] != 'PASS':
              print('RECOMMENDED SOLUTIONS:', gk['recommended_solutions'])
              raise SystemExit(1)
          "

      - name: Verify Live Render Endpoint & Alert on Failure
        run: |
          RENDER_URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$RENDER_URL" ]; then
            RENDER_URL="https://edgemetrix-pro-2026.onrender.com"
          fi
          RESP=$(curl -sS -w "\n%{http_code}" --retry 3 --retry-delay 15 "$RENDER_URL/gatekeeper" || echo -e "UNREACHABLE\n000")
          CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "LIVE RENDER ($CODE): $BODY"
          if [ "$CODE" != "200" ]; then
            echo "::error::Render Gatekeeper failed ($CODE). Solution: Check Render Dashboard -> Logs & Environment Variables (ODDS_API_KEY, DATABASE_URL) and click Manual Deploy -> Deploy latest commit."
            exit 1
          fi
