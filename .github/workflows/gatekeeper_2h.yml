name: Gatekeeper 2-Hourly Engine Health Audit

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  gatekeeper-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Verify Core UI & 6-Tab Lock
        run: python lock_check.py

      - name: Run Full 6-Tab & Gatekeeper Diagnostic Audit
        run: |
          python -c "
          import app
          c = app.app.test_client()
          for tab in ['daily_picks', 'btts_goals', 'bet_builder', 'correct_score', 'true_clv', 'tactical_health']:
              r = c.get(f'/?tab={tab}')
              assert r.status_code == 200, f'Tab {tab} failed with {r.status_code}'
          gk = c.get('/gatekeeper')
          print('GATEKEEPER AUDIT:', gk.get_json())
          assert gk.status_code == 200 and gk.get_json()['gatekeeper_status'] == 'PASS'
          "

      - name: Wake & Verify Live Render Production Endpoint
        run: |
          RENDER_URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$RENDER_URL" ]; then
            RENDER_URL="https://gem-v15-engine.onrender.com"
          fi
          echo "Pinging $RENDER_URL/gatekeeper ..."
          curl -fsS --retry 3 --retry-delay 15 "$RENDER_URL/gatekeeper" || echo "Live Render endpoint warming up or custom URL not set in RENDER_APP_URL secret"
