<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EDGEMETRIX V300 PRO -- Syndicate Terminal</title>
    <style>
        body { font-family: sans-serif; background-color: #070b12; color: #f8fafc; margin: 0; padding: 30px; }
        h1 { color: #facc15; font-size: 26px; }
        .nav-tabs { display: flex; gap: 12px; margin-bottom: 30px; border-bottom: 1px solid #1e293b; padding-bottom: 15px; }
        .tab-btn { background: #0d1527; color: #94a3b8; border: 1px solid #1e293b; padding: 10px 22px; border-radius: 8px; text-decoration: none; font-weight: 600; }
        .tab-btn.active { background: #facc15; color: #000; }
        .card { background: #0d1527; border: 1px solid #1e293b; border-radius: 12px; padding: 25px; }
    </style>
</head>
<body>
    <h1>EDGEMETRIX V300 PRO</h1>
    <div class="nav-tabs">
        <a href="/?tab=dailypicks" class="tab-btn {% if active_tab == 'dailypicks' %}active{% endif %}">Daily Picks</a>
        <a href="/?tab=btts" class="tab-btn {% if active_tab == 'btts' %}active{% endif %}">BTTS & Goals</a>
        <a href="/?tab=accagenerator" class="tab-btn {% if active_tab == 'accagenerator' %}active{% endif %}">Acca Generator</a>
    </div>
    <div class="card">
        <h2>Active Tab: {{ active_tab | upper }}</h2>
        <p>Your multi-tab dashboard is fully restored.</p>
    </div>
</body>
</html>
