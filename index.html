<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEM V15.0 ENGINE - Football Accumulator Dashboard</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #238636;
            --gold-color: #d29922;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }
        h1 { color: #58a6ff; margin: 0 0 10px 0; }
        .tiers {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .tier-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .tier-card h3 { margin-top: 0; color: var(--gold-color); }
        .tier-odds { font-size: 1.8em; font-weight: bold; margin: 10px 0; }
        .calculator {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .calculator input {
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 1em;
            width: 120px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }
        .fixture-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
        }
        .leg-badge {
            background-color: #1f6feb;
            color: #fff;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .match-title { font-weight: bold; font-size: 1.1em; margin: 8px 0; }
        .selection { color: #3fb950; font-weight: 500; }
        .details {
            font-size: 0.9em;
            color: #8b949e;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>GEM V15.0 ENGINE</h1>
            <p>9-Leg Tactical Football Accumulator Pipeline</p>
        </header>

        <div class="tiers" id="tiers-container">
            <div class="tier-card">
                <h3>3-Fold Tier</h3>
                <div class="tier-odds" id="odds-3">--</div>
                <div id="return-3">Est. Return: --</div>
            </div>
            <div class="tier-card">
                <h3>6-Fold Tier</h3>
                <div class="tier-odds" id="odds-6">--</div>
                <div id="return-6">Est. Return: --</div>
            </div>
            <div class="tier-card">
                <h3>9-Fold Tier</h3>
                <div class="tier-odds" id="odds-9">--</div>
                <div id="return-9">Est. Return: --</div>
            </div>
        </div>

        <div class="calculator">
            <label for="stake-input"><strong>Base Stake (£): </strong></label>
            <input type="number" id="stake-input" value="10" min="1" step="1">
        </div>

        <h2>Active 9-Leg Slate</h2>
        <div class="grid" id="fixtures-grid">Loading active fixtures...</div>
    </div>

    <script>
        let globalOdds = { three: 0, six: 0, nine: 0 };

        async function fetchSlate() {
            try {
                const res = await fetch('/api/fixtures');
                const data = await res.json();
                
                globalOdds.three = data.accumulators.three_fold.odds;
                globalOdds.six = data.accumulators.six_fold.odds;
                globalOdds.nine = data.accumulators.nine_fold.odds;

                document.getElementById('odds-3').innerText = globalOdds.three.toFixed(2);
                document.getElementById('odds-6').innerText = globalOdds.six.toFixed(2);
                document.getElementById('odds-9').innerText = globalOdds.nine.toFixed(2);

                updateReturns();

                const grid = document.getElementById('fixtures-grid');
                grid.innerHTML = '';
                
                data.slate.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'fixture-card';
                    card.innerHTML = 
                        <div><span class="leg-badge">LEG </span></div>
                        <div class="match-title"></div>
                        <div class="selection"></div>
                        <div class="details">
                            <span>Odds: </span>
                            <span></span>
                        </div>
                    ;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error("Error loading fixtures:", err);
                document.getElementById('fixtures-grid').innerText = "Failed to load fixture pipeline.";
            }
        }

        function updateReturns() {
            const stake = parseFloat(document.getElementById('stake-input').value) || 0;
            document.getElementById('return-3').innerText = Est. Return: £;
            document.getElementById('return-6').innerText = Est. Return: £;
            document.getElementById('return-9').innerText = Est. Return: £;
        }

        document.getElementById('stake-input').addEventListener('input', updateReturns);
        fetchSlate();
    </script>
</body>
</html>
