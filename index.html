<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EdgeMETRIX PRO 26 (v147)</title>
<style>
body{margin:0;background:#080d1a;color:#f8fafc;font-family:system-ui,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:18px}
.hdr{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e293b;padding-bottom:12px;margin-bottom:14px}
.brand{font-size:20px;font-weight:800;color:#38bdf8}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tab{background:#0f172a;border:1px solid #1e293b;color:#94a3b8;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.tab.active{border-color:#38bdf8;color:#fff;background:#13203b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:14px}
.comp{font-size:11px;color:#94a3b8;display:flex;justify-content:space-between}
.match{font-size:16px;font-weight:700;margin:6px 0}
.pick{font-size:14px;font-weight:700;color:#10b981;background:rgba(16,185,129,.1);padding:7px 10px;border-radius:8px}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px}
.odds{color:#f59e0b;font-weight:800}
.btn{background:#1e293b;color:#38bdf8;border:1px solid #334155;border-radius:6px;padding:5px 10px;cursor:pointer;font-weight:700}
.btn.on{background:#065f46;color:#6ee7b7}
.slip{position:sticky;bottom:12px;margin-top:16px;background:#0f172a;border:1px solid #38bdf8;border-radius:12px;padding:12px 16px;display:none;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <span class="brand">EdgeMETRIX PRO 26 • v147</span>
    <span id="meta" style="font-size:12px;color:#94a3b8">Loading live feed...</span>
  </div>
  <div class="tabs">
    <button class="tab active" data-t="todaysValue">Perfect Value</button>
    <button class="tab" data-t="matches">All Matches</button>
    <button class="tab" data-t="acca10">Acca 10</button>
    <button class="tab" data-t="likely">Most Likely</button>
    <button class="tab" data-t="ai">AI Picks</button>
  </div>
  <div class="grid" id="grid">
    {% for x in data %}
    <div class="card">
      <div class="comp"><span>{{ x.comp }}</span><span>TODAY</span></div>
      <div class="match">{{ x.match }}</div>
      <div class="pick">{{ x.pick }}</div>
      <div class="meta"><span class="odds">ODDS: {{ x.odds }}</span></div>
    </div>
    {% endfor %}
  </div>
  <div class="slip" id="slip">
    <div id="stxt" style="font-size:13px;font-weight:700"></div>
    <button class="btn" onclick="clr()">Clear</button>
  </div>
</div>
<script>
let fd = null, ct = "todaysValue", sl = [];
function draw(t) {
  ct = t;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.t === t));
  if (!fd) return;
  const list = (fd[t] && fd[t].length) ? fd[t] : (fd.matches || []);
  const g = document.getElementById("grid");
  g.innerHTML = "";
  list.forEach(m => {
    const fx = m.fixture || m.f || m.match || "Match";
    const pk = m.pick || m.pk || "";
    const lg = m.league || m.comp || "GLOBAL";
    const od = Number(m.odds || m.o || 1.50).toFixed(2);
    const ev = m.ev ? " • +EV " + Number(m.ev).toFixed(1) + "%" : "";
    const ko = (m.kickoff || "").replace("T", " ").replace("Z", " UTC");
    const on = sl.some(s => s.fx === fx && s.pk === pk);
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<div class="comp"><span>${lg}</span><span>${ko}</span></div>
      <div class="match">${fx}</div>
      <div class="pick">${pk}</div>
      <div class="meta"><span class="odds">ODDS: ${od}${ev}</span></div>`;
    const btn = document.createElement("button");
    btn.className = "btn" + (on ? " on" : "");
    btn.textContent = on ? "In Slip" : "+ Bet Slip";
    btn.onclick = () => tog(fx, pk, Number(od));
    card.querySelector(".meta").appendChild(btn);
    g.appendChild(card);
  });
}
function tog(fx, pk, od) {
  const i = sl.findIndex(s => s.fx === fx && s.pk === pk);
  if (i >= 0) sl.splice(i, 1); else sl.push({fx, pk, od});
  draw(ct);
  const b = document.getElementById("slip");
  if (!sl.length) { b.style.display = "none"; return; }
  const tot = sl.reduce((a, x) => a * x.od, 1).toFixed(2);
  document.getElementById("stxt").textContent = `BET SLIP (${sl.length}-Fold): ` + sl.map(s => `${s.fx} [${s.pk} @ ${s.od}]`).join(" | ") + ` | Total Odds: ${tot}`;
  b.style.display = "flex";
}
function clr() { sl = []; document.getElementById("slip").style.display = "none"; draw(ct); }
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => draw(b.dataset.t)));
fetch("/api/gem-feed?v=147").then(r => r.json()).then(d => {
  if (d && d.matches && d.matches.length) {
    fd = d;
    document.getElementById("meta").textContent = `${d.matches.length} Global Matches • ${d.todaysValue.length} Value Picks`;
    document.querySelector('[data-t="todaysValue"]').textContent = `Perfect Value (${d.todaysValue.length})`;
    document.querySelector('[data-t="matches"]').textContent = `All Matches (${d.matches.length})`;
    document.querySelector('[data-t="acca10"]').textContent = `Acca 10 (${d.acca10.length})`;
    draw(ct);
  }
}).catch(err => { document.getElementById("meta").textContent = "Feed error: " + err; });
</script>
</body>
</html>
