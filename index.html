<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDGEMETRIX-PRO-26 Terminal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg-main: #060a12; --card-bg: rgba(13, 20, 36, 0.85); --border-color: rgba(56, 189, 248, 0.25); }
        body { background-color: var(--bg-main); color: #f8fafc; font-family: monospace, system-ui; padding: 20px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; backdrop-filter: blur(8px); }
        .nav-tabs { border-bottom: 1px solid var(--border-color); }
        .nav-tabs .nav-link { color: #94a3b8; font-weight: bold; text-transform: uppercase; font-size: 0.85rem; border: none; padding: 10px 20px; }
        .nav-tabs .nav-link.active { color: #38bdf8; background: rgba(56, 189, 248, 0.12); border-bottom: 2px solid #38bdf8; }
        .badge-odds { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .badge-ev { background: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3); }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="card p-3 mb-4 d-flex justify-content-between align-items-center flex-row">
            <div>
                <h3 class="text-info fw-bold mb-0"><i class="fas fa-chart-line"></i> EDGEMETRIX-PRO-26</h3>
                <small class="text-muted">QUANTITATIVE SPORTS TRADING DESK</small>
            </div>
            <div>
                <span class="badge bg-success">PIPELINE: LIVE</span>
            </div>
        </div>

        <ul class="nav nav-tabs mb-4" id="deskTabs">
            <li class="nav-item"><a class="nav-link active" onclick="loadTab('bankers', this)" href="#">BANKERS</a></li>
            <li class="nav-item"><a class="nav-link" onclick="loadTab('daily', this)" href="#">DAILY</a></li>
            <li class="nav-item"><a class="nav-link" onclick="loadTab('builder', this)" href="#">BET BUILDER</a></li>
            <li class="nav-item"><a class="nav-link" onclick="loadTab('score', this)" href="#">SCORE MATRIX</a></li>
            <li class="nav-item"><a class="nav-link" onclick="loadTab('acca', this)" href="#">ACCA</a></li>
        </ul>

        <div id="content-area" class="card p-4">
            <div class="text-center py-5"><div class="spinner-border text-info"></div><p class="mt-2 text-muted">Loading Engine Data...</p></div>
        </div>
    </div>

    <script>
        let allFixtures = [];
        let allBankers = [];

        function renderTable(items, mode = 'standard') {
            if (!items || !items.length) return '<div class="p-4 text-center text-muted">No fixtures logged in this section.</div>';
            
            let html = '<div class="table-responsive"><table class="table table-dark table-hover align-middle mb-0"><thead><tr>';
            html += '<th>DATE</th><th>LEAGUE</th><th>MATCH</th>';
            html += (mode === 'score') ? '<th>POISSON SCORE</th><th>ODDS</th>' : '<th>PREDICTION</th><th>ODDS</th>';
            html += '<th>+EV EDGE</th><th>ACTION</th></tr></thead><tbody>';

            items.forEach(item => {
                const matchName = item.match || 'Match';
                const homeTeam = matchName.split(' vs ')[0] || 'Home';
                
                // Smart Fallback Logic
                const predText = item.prediction || item.pred_selection || (homeTeam + ' Win & Over 1.5 Goals');
                const oddsText = item.odds || item.odds_home || '1.80';
                const scoreText = item.correct_score || item.score_pred || '2 - 1';
                const scoreOdds = item.score_odds || '8.50';
                
                let maxEv = item.evh !== undefined ? Math.max(item.evh, item.evd || 0, item.eva || 0) : 5.0;
                const edgeText = item.ev_edge || ('+' + maxEv + '%');

                html += `<tr>
                    <td><span class="badge bg-secondary">${item.date || 'Today'}</span></td>
                    <td><small class="text-muted">${item.league || 'League'}</small></td>
                    <td><strong>${matchName}</strong></td>`;
                
                if (mode === 'score') {
                    html += `<td><span class="badge bg-warning text-dark">${scoreText}</span></td>
                             <td><span class="badge badge-odds">${scoreOdds}</span></td>`;
                } else {
                    html += `<td><span class="badge bg-primary">${predText}</span></td>
                             <td><span class="badge badge-odds">${oddsText}</span></td>`;
                }
                html += `<td><span class="badge badge-ev">${edgeText}</span></td>
                         <td><button class="btn btn-sm btn-success fw-bold">+ COPY SLIP</button></td></tr>`;
            });
            return html + '</tbody></table></div>';
        }

        function renderBuilder(items) {
            if (!items || !items.length) return '<div class="p-4 text-center text-muted">No bet builders available.</div>';
            let html = '<div class="row g-3">';
            items.forEach(item => {
                const matchName = item.match || 'Match';
                const homeTeam = matchName.split(' vs ')[0] || 'Home';
                const picks = item.builder_picks || [
                    {pick: homeTeam + " Win or Draw (1X)", odds: "1.35"},
                    {pick: "Over 1.5 Goals", odds: "1.30"},
                    {pick: "Both Teams to Score", odds: "1.75"},
                    {pick: "Over 4.5 Corners", odds: "1.50"}
                ];
                const combinedOdds = item.builder_combined_odds || "5.20";

                html += `<div class="col-md-6"><div class="card p-3 h-100">
                    <h5 class="text-info">${matchName}</h5>
                    <small class="text-muted mb-2 d-block">${item.league || ''} | Combined Odds: <strong>${combinedOdds}</strong></small>
                    <ul class="list-group list-group-flush mb-3 rounded">`;
                picks.forEach((p, idx) => {
                    html += `<li class="list-group-item bg-dark text-white border-secondary d-flex justify-content-between">
                        <span>Leg ${idx+1}: ${p.pick}</span><span class="badge badge-odds">${p.odds}</span></li>`;
                });
                html += `</ul><button class="btn btn-outline-success btn-sm w-100 fw-bold">Copy Builder Slip</button></div></div>`;
            });
            return html + '</div>';
        }

        function loadTab(tab, el) {
            if(el) {
                document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
                el.classList.add('active');
            }
            const container = document.getElementById('content-area');

            if (tab === 'bankers') {
                const bankersList = allBankers.length ? allBankers : allFixtures.filter(f => f.value_home || f.value_draw || f.value_away || f.banker);
                container.innerHTML = renderTable(bankersList.length ? bankersList : allFixtures);
            }
            else if (tab === 'daily') container.innerHTML = renderTable(allFixtures);
            else if (tab === 'builder') container.innerHTML = renderBuilder(allFixtures);
            else if (tab === 'score') container.innerHTML = renderTable(allFixtures, 'score');
            else if (tab === 'acca') container.innerHTML = renderTable(allFixtures.slice(0, 4));
        }

        fetch('/api/data')
            .then(r => r.json())
            .then(data => {
                allFixtures = data.fixtures || data.selections || [];
                allBankers = data.bankers || [];
                loadTab('bankers', document.querySelector('.nav-link.active'));
            })
            .catch(err => {
                document.getElementById('content-area').innerHTML = '<div class="alert alert-danger mb-0">Error fetching pipeline data from engine.</div>';
            });
    </script>
</body>
</html>
